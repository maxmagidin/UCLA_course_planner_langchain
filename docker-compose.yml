services:
  planner:
    build: .
    ports:
      - "8765:8765"
    environment:
      PLANNER_DATABASE_PATH: /app/.data/planner.sqlite3
      PLANNER_JOB_WORKERS: "${PLANNER_JOB_WORKERS:-2}"
      PLANNER_MAX_QUEUED_JOBS: "${PLANNER_MAX_QUEUED_JOBS:-20}"
      PLANNER_JOB_RETENTION_DAYS: "${PLANNER_JOB_RETENTION_DAYS:-7}"
      PLANNER_MAX_COURSES_PER_DEPARTMENT: "${PLANNER_MAX_COURSES_PER_DEPARTMENT:-12}"
      PLANNER_ENABLE_GRADES: "${PLANNER_ENABLE_GRADES:-true}"
      PLANNER_ENABLE_HISTORICAL_ENROLLMENT: "${PLANNER_ENABLE_HISTORICAL_ENROLLMENT:-false}"
      PLANNER_ENABLE_BRUINWALK: "${PLANNER_ENABLE_BRUINWALK:-false}"
      MODEL_PROVIDER: "${MODEL_PROVIDER:-openai_compatible}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      MODEL_BASE_URL: "${MODEL_BASE_URL:-https://api.openai.com/v1}"
      MODEL_NAME: "${MODEL_NAME:-gpt-4o-mini}"
      MODEL_TEMPERATURE: "${MODEL_TEMPERATURE:-0}"
      LANGSMITH_TRACING: "${LANGSMITH_TRACING:-false}"
      LANGSMITH_API_KEY: "${LANGSMITH_API_KEY:-}"
      LANGSMITH_PROJECT: "${LANGSMITH_PROJECT:-ucla-course-planner}"
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS:-}"
      ALLOW_INSECURE_MODEL_BASE_URLS: "${ALLOW_INSECURE_MODEL_BASE_URLS:-false}"
      ALLOW_PRIVATE_MODEL_BASE_URLS: "${ALLOW_PRIVATE_MODEL_BASE_URLS:-false}"
    volumes:
      - planner-data:/app/.data
    restart: unless-stopped

volumes:
  planner-data:
